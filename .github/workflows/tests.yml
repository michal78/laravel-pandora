name: tests

on:
  push:
    branches: [master, development]
  pull_request:

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · sqlite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['13.*']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  databases:
    name: ${{ matrix.db.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - { name: mysql,      image: 'mysql:8.4',           port: 3306, conn: mysql }
          - { name: mariadb,    image: 'mariadb:11',          port: 3306, conn: mariadb }
          - { name: postgresql, image: 'postgres:17',         port: 5432, conn: pgsql }
          # The pgvector leg. Optional at runtime, mandatory here: Phase 4
          # produced seven defects and not one was reachable by the suite as
          # configured, and "optional, therefore untested" is that shape
          # exactly. Memory/PgvectorTest SKIPS without this image rather than
          # passing, so removing this leg makes the gap visible instead of
          # silent.
          - { name: pgvector,   image: 'pgvector/pgvector:pg17', port: 5432, conn: pgsql }
    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: pandora
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: pandora
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pandora
        ports: ['${{ matrix.db.port }}:${{ matrix.db.port }}']
        options: >-
          --health-cmd="exit 0" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_mysql, pdo_pgsql
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: ${{ matrix.db.conn }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db.port }}
          DB_DATABASE: pandora
          DB_USERNAME: ${{ matrix.db.conn == 'pgsql' && 'postgres' || 'root' }}
          DB_PASSWORD: password

  # The object-storage leg. Optional at runtime, mandatory here, for the same
  # reason the pgvector leg is: "optional, therefore untested" is how a feature
  # ships with half its behaviour unexercised. `Storage::fake()` is deliberately
  # NOT used — it is the local driver wearing an object store's name, so a suite
  # green against it would be proving the local adapter twice.
  #
  # StorageContractTest, KeyNormalisationTest and TenantPrefixTest SKIP without
  # an endpoint rather than passing, so deleting this job makes the gap visible
  # instead of silent.
  #
  # MinIO runs as a STEP, not as a `services:` container, and the reason is a
  # scar: this leg used `bitnami/minio`, whose env vars started the server and
  # created the bucket for us. Bitnami retired that Docker Hub catalogue and the
  # tag stopped resolving — `manifest unknown` — so the job died before PHP was
  # installed. The official `minio/minio` image needs a command (`server /data`)
  # and `services:` has nowhere to put one. Starting it by hand costs eight
  # lines and owes nothing to a vendor's distribution policy.
  object-storage:
    name: object storage · minio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO and create the bucket
        run: |
          set -euo pipefail

          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=pandora \
            -e MINIO_ROOT_PASSWORD=pandora-secret \
            minio/minio:latest server /data

          # Ready means answering, not running: the bucket creation below fails
          # against a server that has started but not yet bound its port.
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO is live."
              break
            fi
            sleep 2
          done

          curl -fs http://127.0.0.1:9000/minio/health/live >/dev/null

          docker run --rm --network host --entrypoint sh minio/mc:latest -c "
            mc alias set local http://127.0.0.1:9000 pandora pandora-secret &&
            mc mb --ignore-existing local/pandora-test
          "

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          PANDORA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          PANDORA_TEST_S3_KEY: pandora
          PANDORA_TEST_S3_SECRET: pandora-secret
          PANDORA_TEST_S3_BUCKET: pandora-test
          PANDORA_TEST_S3_REGION: us-east-1

  # One check name that stands for every leg above.
  #
  # A branch ruleset names the checks it requires, and a matrix expands into one
  # check per leg — so requiring them individually means editing the ruleset
  # every time a database is added, and a leg added but not required is a leg
  # nobody has to pass. This job is the single name to require.
  #
  # `if: always()` plus an explicit result check, rather than bare `needs:`,
  # because a job that is skipped or cancelled does not fail its dependents: a
  # naive aggregator reports success when a leg never ran, which is the exact
  # shape of green-but-untested this repository keeps finding.
  complete:
    name: tests complete
    needs: [sqlite, databases, object-storage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every leg succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A test leg did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: Report
        run: |
          echo "Every leg green: ${{ join(needs.*.result, ', ') }}"
